name: KAI Site Quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "30 4 * * 1"

permissions:
  contents: read

env:
  SITE_URL: https://luxeceram.com/

jobs:
  quality:
    name: Live site quality audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Verify live site responds
        run: |
          curl --fail --silent --show-error --location --retry 3 --retry-delay 2 --output /dev/null "$SITE_URL"
          echo "Live check OK: $SITE_URL"

      - name: Lighthouse audit
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            ${{ env.SITE_URL }}
          runs: 1
          uploadArtifacts: true
          temporaryPublicStorage: false

      - name: Check links in repository content
        uses: lycheeverse/lychee-action@v2
        with:
          args: --root-dir "$(pwd)" --no-progress --max-retries 2 './**/*.html' './**/*.md'
          fail: false
          jobSummary: true

      - name: Content originality report
        run: python .github/kai-content-quality-audit.py
